[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotenv-doctor"
version = "0.1.0"
description = "Validate .env files against a committed .env.example: missing keys, unfilled placeholders, weak secrets, and credentials left in the example."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["dotenv", "env", "configuration", "linter", "ci", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
dotenv-doctor = "dotenv_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/dotenv-doctor"
Issues = "https://github.com/hellpuffyt/dotenv-doctor/issues"
Changelog = "https://github.com/hellpuffyt/dotenv-doctor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dotenv_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
